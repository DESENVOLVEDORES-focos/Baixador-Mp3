name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Análise estática (pyflakes)
        run: python -m pyflakes *.py tests/*.py

      - name: Compilação
        run: python -m compileall -q . -x '(\.git|ferramentas)'

      - name: Testes
        run: python -m pytest -q

      - name: Interface importa sem erro (sem abrir janela)
        run: python -c "import interface, musica, downloader, pesquisa, preferencias, cookies_youtube, thumbs; print('imports ok')"
