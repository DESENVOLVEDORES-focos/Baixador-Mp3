name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # Windows não expande "*.py" no shell: a lista é montada pelo próprio
      # Python para o resultado ser idêntico nos dois sistemas.
      - name: Análise estática (pyflakes)
        run: |
          python -c "import glob,subprocess,sys; alvos=glob.glob('*.py')+glob.glob('tests/*.py'); sys.exit(subprocess.call([sys.executable,'-m','pyflakes',*alvos]))"

      - name: Compilação
        run: python -m compileall -q . -x '(\.git|ferramentas)'

      - name: Testes
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -rf --tb=short 2>&1 | tee saida-testes.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::Testes falharam; resumo nas linhas acima e no artifact."
          fi
          exit "$status"

      - name: Publicar resultado dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saida-testes-${{ matrix.os }}
          path: saida-testes.txt

      - name: Interface importa sem erro (sem abrir janela)
        run: python -c "import interface, musica, downloader, pesquisa, preferencias, cookies_youtube, thumbs; print('imports ok')"
